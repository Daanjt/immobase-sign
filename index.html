                    {protocol.apt_adresse && <><span className="lbl">Wohnung:</span><span>{protocol.apt_adresse}{protocol.apt_plz || protocol.apt_ort ? ", " : ""}{protocol.apt_plz||""} {protocol.apt_ort||""}</span></>}
                    {protocol.room_label && <><span className="lbl">Zimmer:</span><span>{protocol.room_label}</span></>}
                    {protocol.einzug_datum && <><span className="lbl">Einzug am:</span><span>{formatDate(protocol.einzug_datum)}</span></>}
                    <span className="lbl">Eingereicht am:</span><span>{submittedDate}, {submittedTime}</span>
                  </div>
                </div>
              )}

              {(schluesselNr || extraSchluessel) && (
                <div className="info-section">
                  <div className="card-eyebrow">Schlüsselübergabe</div>
                  <div className="info-grid">
                    {schluesselNr && <><span className="lbl">Schlüsselnummer:</span><span>{schluesselNr}</span></>}
                    {extraSchluessel && <><span className="lbl">Extra-Schlüssel:</span><span style={{whiteSpace:"pre-wrap"}}>{extraSchluessel}</span></>}
                  </div>
                </div>
              )}

              <div className="maengel-title">Erfasste Mängel ({photos.length})</div>

              {photos.length === 0 ? (
                <div className="no-maengel">
                  Keine Mängel gemeldet. Die Wohnung wurde in einwandfreiem Zustand übernommen.
                </div>
              ) : (
                alleRaeume.map(r => {
                  const maengel = maengelByRaum[r.key] || [];
                  if (maengel.length === 0) return null;
                  const textOnly = maengel.filter(m => !m.url);
                  const withPhoto = maengel.filter(m => m.url);
                  return (
                    <div key={r.key} className="raum-block">
                      <h3>{r.label}</h3>
                      {textOnly.map((m, i) => (
                        <div key={"t"+i} className="text-mangel">
                          <span className="lbl">Bemerkung:</span>{m.beschreibung || "Ohne Beschreibung"}
                        </div>
                      ))}
                      {withPhoto.length > 0 && (
                        <div className="photo-grid">
                          {withPhoto.map((m, i) => (
                            <div key={"p"+i} className="photo-item">
                              <img src={m.url} alt=""/>
                              <div className="photo-cap">{m.beschreibung || "Ohne Beschreibung"}</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })
              )}

              {mangelText.trim() && (
                <div className="info-section">
                  <div className="card-eyebrow">Weitere Bemerkungen</div>
                  <div style={{fontSize:12,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{mangelText}</div>
                </div>
              )}

              <div className="clauses">
                <div className="ct">Erklärung der Vertragsparteien</div>
                <ol>
                  <li>Die Mietpartei bestätigt den Erhalt der aufgeführten Schlüssel{schluesselNr ? ` (Nr. ${schluesselNr}${extraSchluessel ? `; zusätzlich: ${extraSchluessel.replace(/\n/g, ", ")}` : ""})` : ""} und verpflichtet sich, diese sorgfältig zu verwahren und am Ende des Mietverhältnisses vollzählig zurückzugeben.</li>
                  <li>Die Mietpartei bestätigt, dass die Wohnung im obenstehend dokumentierten Zustand übernommen wurde. Sichtbare Mängel, die innerhalb der 14-tägigen Frist nach Einzug nicht aufgeführt wurden, gelten als nicht vorhanden.</li>
                  <li>Verdeckte Mängel, die bei der Übernahme trotz sorgfältiger Prüfung nicht erkennbar waren (z.B. Schimmel hinter Möbeln), sind der Hauptmieterin innert 10 Tagen ab Entdeckung schriftlich zu melden (Art. 256 OR).</li>
                  <li>Die Mietpartei verpflichtet sich, das Mietobjekt sorgfältig zu nutzen und in vergleichbarem Zustand zurückzugeben (vorbehaltlich normaler Abnutzung gemäss Schweizer Mietrecht).</li>
                  <li>Die Mietpartei bestätigt mit der digitalen Unterschrift die Richtigkeit der Angaben und den Erhalt einer Kopie dieses Protokolls.</li>
                  <li>Bei Streitigkeiten gilt schweizerisches Recht; Gerichtsstand ist der Ort der gelegenen Sache, zwingende gesetzliche Gerichtsstände (insbesondere Art. 33 ZPO) bleiben vorbehalten.</li>
                </ol>
              </div>

              <div className="signatures">
                <div className="sig-block">
                  <div className="role">Mietpartei · digital unterzeichnet</div>
                  {signatureData ? <img src={signatureData} alt="" style={{maxHeight:60,maxWidth:220,display:"block",margin:"4px 0"}}/> : <div className="name">{signatureName}</div>}
                  <div className="meta">Digital unterschrieben am {submittedDate} um {submittedTime}</div>
                </div>
                <div className="sig-block">
                  <div className="role">Hauptmieterin</div>
                  <div className="name">D&amp;T Partners GmbH</div>
                </div>
              </div>
            </div>
          </div>
        );
      }
      
      const deadline = new Date(protocol.deadline);
      const daysLeft = Math.ceil((deadline - new Date()) / (1000*60*60*24));
      
      // ═══ Step 1: Welcome ═══
      if (step === 1) {
        return (
          <div className="wrap">
            <div className="card">
              <div style={{textAlign:"center",marginBottom:14}}>
                <img src={DT_LOGO_DATA_URI} alt="D&T Homes" style={{width:"110px",display:"inline-block"}}/>
              </div>
              <h1>Übernahmeprotokoll</h1>
              <p className="lead">
                Hallo {protocol.mieter_vorname || ""}!
              </p>
              <p style={{marginBottom:16}}>
                Willkommen in deinem neuen Zuhause. Bitte prüfe die Wohnung sorgfältig und dokumentiere allfällige Mängel mit Fotos. Das schützt dich bei der Rückgabe der Wohnung.
              </p>
              
              {(protocol.apt_adresse || protocol.room_label) && (
                <div style={{background:"#fafaf7",border:"1px solid #e1d8c5",borderRadius:8,padding:"12px 14px",marginBottom:16,fontSize:13,lineHeight:1.5}}>
                  {protocol.apt_adresse && <div>📍 {protocol.apt_adresse}{protocol.apt_plz || protocol.apt_ort ? ", " : ""}{protocol.apt_plz||""} {protocol.apt_ort||""}</div>}
                  {protocol.room_label && <div style={{marginTop:4}}>🚪 Zimmer {protocol.room_label}</div>}
                  {protocol.einzug_datum && <div style={{marginTop:4,color:"#5a5044",fontSize:12}}>Einzug: {formatDate(protocol.einzug_datum)}</div>}
                </div>
              )}
              
              {protocol.schluessel_info && (
                <div style={{background:"#fefcf7",border:"1px solid #d8d0c0",borderRadius:8,padding:"14px 16px",marginBottom:20}}>
                  <div style={{fontSize:11,color:"#8a8174",textTransform:"uppercase",letterSpacing:".25em",marginBottom:8,fontWeight:600}}>🔑 Erhaltene Schlüssel</div>
                  <div style={{fontSize:13.5,lineHeight:1.6,color:"#3a352d",whiteSpace:"pre-wrap"}}>{protocol.schluessel_info}</div>
                </div>
              )}
              
              <div style={{background:"#fdf2e0",border:"1px solid #e8c89c",borderRadius:8,padding:"14px 16px",marginBottom:20,fontSize:14,lineHeight:1.5}}>
                <div style={{fontWeight:600,marginBottom:6}}>⏱ Frist bis {deadline.toLocaleDateString("de-CH",{day:"2-digit",month:"long",year:"numeric"})}</div>
                <div style={{color:"#5a5044"}}>Du hast noch <strong>{daysLeft} Tage</strong> Zeit, das Protokoll einzureichen. Danach gilt die Wohnung automatisch als in einwandfreiem Zustand übernommen.</div>
              </div>
              <div style={{marginBottom:24}}>
                <div style={{fontWeight:600,marginBottom:10,fontSize:14}}>Was du tun musst:</div>
                <ol style={{paddingLeft:20,lineHeight:1.7,fontSize:14,color:"#3a352d"}}>
                  <li>Mängel pro Raum dokumentieren (Foto + kurze Beschreibung)</li>
                  <li>Unterschreiben und absenden</li>
                </ol>
                <div style={{marginTop:10,fontSize:12.5,color:"#5a5044",lineHeight:1.5}}>
                  Falls du keine Mängel entdeckst, kannst du direkt weiter zur Unterschrift.
                </div>
              </div>
              <button className="primary" onClick={()=>setStep(2)}>Los geht's →</button>
            </div>
          </div>
        );
      }
      
      // Helper: add custom raum
      async function addCustomRaum() {
        const label = prompt("Name des Raums (z.B. Balkon, Keller, Waschkueche):");
        if (!label || !label.trim()) return;
        const key = "custom_" + Date.now();
        const newRaum = { key, label: label.trim(), icon: "🚪" };
        const updated = [...customRaeume, newRaum];
        setCustomRaeume(updated);
        try {
          await supabase.from("handover_protocols").update({
            custom_raeume: updated,
            updated_at: new Date().toISOString()
          }).eq("token", token);
        } catch (e) {
          alert("Speichern fehlgeschlagen: " + (e.message || e));
        }
      }
      
      async function removeCustomRaum(key) {
        const raumPhotos = photos.filter(p => p.raum === key);
        if (raumPhotos.length > 0) {
          if (!confirm(`Dieser Raum enthält ${raumPhotos.length} Mangel${raumPhotos.length>1?"s":""}. Trotzdem entfernen?`)) return;
        }
        const updatedCustom = customRaeume.filter(r => r.key !== key);
        const updatedPhotos = photos.filter(p => p.raum !== key);
        // Storage cleanup fuer entfernte fotos
        for (const p of raumPhotos) {
          if (p.path) {
            try { await supabase.storage.from("handover-photos").remove([p.path]); } catch(e){}
          }
        }
        setCustomRaeume(updatedCustom);
        setPhotos(updatedPhotos);
        try {
          await supabase.from("handover_protocols").update({
            custom_raeume: updatedCustom,
            photos: updatedPhotos,
            updated_at: new Date().toISOString()
          }).eq("token", token);
        } catch(e) {
          alert("Speichern fehlgeschlagen: " + (e.message || e));
        }
      }
      
      // ═══ Step 2: Mängel pro Raum ═══
      if (step === 2) {
        // Alle Raeume: fixe + custom
        const alleRaeume = [...RAEUME, ...customRaeume];
        // Get Mängel grouped by raum
        const maengelByRaum = {};
        alleRaeume.forEach(r => { maengelByRaum[r.key] = []; });
        photos.forEach((p, idx) => {
          if (maengelByRaum[p.raum] !== undefined) {
            maengelByRaum[p.raum].push({...p, _idx: idx});
          }
        });
        
        return (
          <div className="wrap">
            <div className="card">
              <div style={{fontSize:11,color:"#8a8174",marginBottom:8}}>Schritt 2 von 3</div>
              <h1>Mängel dokumentieren</h1>
              <p style={{marginBottom:8}}>Wenn du in einem Raum einen Mangel entdeckst, mach ein Foto und beschreibe ihn kurz.</p>
              <div style={{background:"#fdf2e0",border:"1px solid #e8c89c",borderRadius:8,padding:"10px 14px",marginBottom:20,fontSize:12,lineHeight:1.5,color:"#5a5044"}}>
                <strong>Wichtig:</strong> Alle Mängel die du hier nicht meldest, könnten bei der Rückgabe der Wohnung zu deinen Lasten gehen.
              </div>
              
              {alleRaeume.map(r => {
                const maengel = maengelByRaum[r.key] || [];
                const isAddingHere = newMangel && newMangel.raum === r.key;
                const isCustom = r.key.startsWith("custom_");
                return (
                  <div key={r.key} style={{background:"#fafaf7",border:"1px solid #e1d8c5",borderRadius:8,padding:"14px 16px",marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:maengel.length > 0 || isAddingHere ? 12 : 0,gap:8}}>
                      <div style={{fontSize:14,fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
                        <span>{r.icon} {r.label}</span>
                        {isCustom && (
                          <button onClick={()=>removeCustomRaum(r.key)} style={{background:"none",border:"none",color:"#9b4a3e",fontSize:14,cursor:"pointer",padding:"0 4px",lineHeight:1}} title="Raum entfernen">×</button>
                        )}
                      </div>
                      <div style={{fontSize:11,color:maengel.length > 0 ? "#8a3a2e" : "#8a8174",fontWeight:maengel.length > 0 ? 600 : 400}}>
                        {maengel.length === 0 ? "keine Mängel" : `${maengel.length} Mangel${maengel.length !== 1 ? "s" : ""}`}
                      </div>
                    </div>
                    
                    {maengel.map((m, i) => (
                      <div key={m._idx} style={{background:"#fefcf7",border:"1px solid #e1d8c5",borderRadius:6,padding:"10px 12px",marginBottom:8,display:"flex",gap:10,alignItems:"flex-start"}}>
                        {m.url && (
                          <div style={{flexShrink:0,width:64,height:64,background:"#eee",borderRadius:4,overflow:"hidden"}}>
                            <img src={m.url} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                          </div>
                        )}
                        <div style={{flex:1,minWidth:0,fontSize:12.5,color:"#3a352d",lineHeight:1.4,paddingTop:m.url ? 0 : 4}}>
                          {m.beschreibung || (m.url ? <span style={{color:"#8a8174",fontStyle:"italic"}}>Nur Foto, keine Beschreibung</span> : <span style={{color:"#8a8174",fontStyle:"italic"}}>Ohne Foto</span>)}
                        </div>
                        <button onClick={()=>removePhoto(m._idx)} style={{flexShrink:0,background:"none",color:"#9b4a3e",border:"none",fontSize:16,cursor:"pointer",padding:"0 4px",lineHeight:1}}>×</button>
                      </div>
                    ))}
                    
                    {isAddingHere ? (
                      <div style={{background:"#fefcf7",border:"1px solid #a8c0d5",borderRadius:6,padding:"12px 14px"}}>
                        <div style={{fontSize:11.5,color:"#3a5570",marginBottom:8,fontWeight:600}}>Neuer Mangel</div>
                        <textarea
                          value={newMangel.text}
                          onChange={e=>setNewMangel(p=>({...p,text:e.target.value}))}
                          placeholder="z.B. 'Kratzer auf Parkett', 'Türgriff locker'..."
                          style={{width:"100%",minHeight:56,padding:"8px 10px",border:"1px solid #d8d0c0",borderRadius:5,fontSize:13,fontFamily:"inherit",lineHeight:1.5,boxSizing:"border-box",resize:"vertical",marginBottom:8}}
                        />
                        {newMangel.tempUrl ? (
                          <div style={{position:"relative",width:120,height:120,marginBottom:8}}>
                            <img src={newMangel.tempUrl} style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:5}} alt=""/>
                            <button onClick={()=>removeMangelTempPhoto()} style={{position:"absolute",top:3,right:3,background:"rgba(0,0,0,.7)",color:"#fff",border:"none",borderRadius:"50%",width:22,height:22,fontSize:12,cursor:"pointer",lineHeight:"22px",padding:0}}>×</button>
                          </div>
                        ) : (
                          <label style={{display:"inline-block",cursor:"pointer",background:newMangel.uploading ? "#f0ebe1" : "#e8efde",color:newMangel.uploading ? "#8a8174" : "#3a5230",border:"1px solid " + (newMangel.uploading ? "#d8d0c0" : "#c5d5b0"),borderRadius:5,padding:"7px 12px",fontSize:12,fontWeight:600,marginBottom:8}}>
                            {newMangel.uploading ? "Lade hoch..." : "📸 Foto aufnehmen"}
                            <input type="file" accept="image/*" capture="environment" disabled={newMangel.uploading} onChange={e=>{
                              const file = e.target.files[0];
                              if (file) uploadMangelPhoto(file);
                              e.target.value = "";
                            }} style={{display:"none"}}/>
                          </label>
                        )}
                        <div style={{display:"flex",gap:6,marginTop:6}}>
                          <button onClick={cancelNewMangel} style={{fontSize:12,padding:"6px 12px",background:"#f0ebe1",color:"#4a4439",border:"1px solid #d8d0c0",borderRadius:5,cursor:"pointer"}}>Abbrechen</button>
                          <button onClick={saveNewMangel} disabled={!newMangel.text.trim() && !newMangel.tempPath} style={{fontSize:12,padding:"6px 12px",background: (!newMangel.text.trim() && !newMangel.tempPath) ? "#f0ebe1" : "#3a5230",color: (!newMangel.text.trim() && !newMangel.tempPath) ? "#8a8174" : "#fff",border: "1px solid " + ((!newMangel.text.trim() && !newMangel.tempPath) ? "#d8d0c0" : "#3a5230"),borderRadius:5,cursor: (!newMangel.text.trim() && !newMangel.tempPath) ? "not-allowed" : "pointer",fontWeight:600}}>
                            ✓ Mangel speichern
                          </button>
                        </div>
                      </div>
                    ) : (
                      <button onClick={()=>startNewMangel(r.key)} style={{width:"100%",padding:"9px 12px",background:"#fefcf7",color:"#4a4439",border:"1px dashed #d8d0c0",borderRadius:5,cursor:"pointer",fontSize:12.5,fontWeight:500}}>
                        + Mangel hinzufügen
                      </button>
                    )}
                  </div>
                );
              })}
              
              <button onClick={addCustomRaum} style={{width:"100%",padding:"11px 14px",background:"#fefcf7",color:"#4a4439",border:"1px dashed #b8b0a0",borderRadius:6,cursor:"pointer",fontSize:12.5,fontWeight:500,marginBottom:6}}>
                + Weiteren Raum hinzufügen (z.B. Balkon, Keller)
              </button>
              
              <div style={{display:"flex",gap:8,marginTop:20}}>
                <button className="secondary" onClick={()=>setStep(1)} style={{flex:1}}>← Zurück</button>
                <button className="primary" onClick={()=>setStep(3)} disabled={uploadingRaum!==null || !!(newMangel && newMangel.uploading)} style={{flex:2}}>{(uploadingRaum!==null || (newMangel && newMangel.uploading)) ? "Foto lädt …" : "Weiter →"}</button>
              </div>
            </div>
          </div>
        );
      }
      
      // ═══ Step 3: Signatur + Bestätigen ═══
      const totalMaengel = photos.length;
      return (
        <div className="wrap">
          <div className="card">
            <div style={{fontSize:11,color:"#8a8174",marginBottom:8}}>Schritt 3 von 3</div>
            <h1>Bestätigen und absenden</h1>
            <p style={{marginBottom:20}}>Bitte überprüfe deine Angaben und unterschreibe unten.</p>
            
            <div style={{background:"#fafaf7",border:"1px solid #e1d8c5",borderRadius:8,padding:"14px 16px",marginBottom:20,fontSize:13,lineHeight:1.7}}>
              <div style={{fontWeight:600,marginBottom:8}}>Zusammenfassung</div>
              <div>📋 <strong>{totalMaengel}</strong> Mangel{totalMaengel !== 1 ? "s" : ""} erfasst</div>
              <div>{totalMaengel === 0 ? "Du hast keine Mängel gemeldet. Die Wohnung gilt somit als in einwandfreiem Zustand übernommen." : "Bitte prüfe im vorigen Schritt ob du alle Mängel erfasst hast."}</div>
            </div>
            
            <div style={{marginBottom:20}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:8}}>Weitere Bemerkungen (optional)</label>
              <textarea
                value={mangelText}
                onChange={e=>setMangelText(e.target.value)}
                placeholder="Sonstige Anmerkungen die nicht raum-spezifisch sind..."
                style={{width:"100%",minHeight:80,padding:"10px 12px",border:"1px solid #d8d0c0",borderRadius:8,fontSize:13,fontFamily:"inherit",lineHeight:1.6,boxSizing:"border-box",resize:"vertical"}}
              />
            </div>
            
            <div style={{marginBottom:20}}>
              <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:8}}>Deine Unterschrift</label>
              <div style={{fontSize:12.5,color:"#5a5044",marginBottom:8}}>Unterschreibe mit dem Finger (Handy/Tablet) oder mit der Maus (Computer).</div>
              <SignaturePad value={signatureData} onChange={setSignatureData} placeholder="↓ Hier mit Finger oder Maus unterschreiben ↓" />
            </div>
            
            <div style={{fontSize:12,color:"#5a5044",lineHeight:1.6,padding:"12px 14px",background:"#fdf2e0",border:"1px solid #e8c89c",borderRadius:8,marginBottom:20}}>
              Mit dem Absenden bestätige ich, dass ich die Wohnung dokumentiert habe und dass die oben angegebenen Mängel den Zustand bei Übernahme wiedergeben. Später gemeldete Mängel, die nicht aufgeführt sind, können mir bei der Rückgabe angerechnet werden. Versteckte Mängel bleiben vorbehalten (Art. 256 OR).
            </div>
            
            <div style={{display:"flex",gap:8}}>
              <button className="secondary" onClick={()=>setStep(2)} disabled={submitting} style={{flex:1}}>← Zurück</button>
              <button className="primary" onClick={submitProtocol} disabled={submitting || !signatureData || uploadingRaum!==null || !!(newMangel && newMangel.uploading)} style={{flex:2}}>
                {submitting ? "Sende..." : "✓ Protokoll absenden"}
              </button>
            </div>
          </div>
        </div>
      );
    }
    
    // ════════════════════════════════════════════════════════════════════════
    // APP ROOT
    // ════════════════════════════════════════════════════════════════════════
    function App() {
      // Extract token from URL pathname
      const path = window.location.pathname.replace(/^\//, "").replace(/\/$/, "");
      
      // Handover-Route: /uebernahme/{token}
      if (path.startsWith("uebernahme/")) {
        const handoverToken = path.substring("uebernahme/".length);
        if (!handoverToken || handoverToken.length < 16) {
          return (
            <StatusScreen
              icon="🔗"
              title="Ungültiger Link"
              message="Diese Seite kann nur über einen persönlichen Übernahmelink besucht werden. Bitte überprüfe den Link aus deiner E-Mail von D&T Homes."
              code="INVALID_URL"
            />
          );
        }
        return <UebernahmePage token={handoverToken} />;
      }
      
      // Token-Validierung (mindestens 16 Zeichen)
      if (!path || path.length < 16) {
        return (
          <StatusScreen
            icon="🔗"
            title="Ungültiger Link"
            message="Diese Seite kann nur über einen persönlichen Vertragslink besucht werden. Bitte überprüfe den Link aus deiner E-Mail von D&T Homes."
            code="INVALID_URL"
          />
        );
      }
      
      return <SignPage token={path} />;
    }
    
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
</body>
</html>
